<title>Ecosystem Audit</title>
<style>
  :root{
    /* HIG light set (ty-artifact-standard §1, 2026-09-23), mapped onto this page's names */
    --paper:#F2F2F7; --surface:#FFFFFF; --sunk:#F2F2F7; --ink:#1C1C1E;
    --ink-soft:#3C3C43; --muted:#8E8E93; --rule:#E5E5EA;
    --accent:#1E7F3C; --accent-bg:#E7F8EB;          /* green: text-safe ink doubles as fill */
    --critical:#D70015; --critical-bg:#FFE7E6;      /* red ink */
    --warning:#FF9500; --warning-bg:#FFF2E0; --warning-ink:#8A5200; /* amber fill + text ink */
  }
  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 72px}
  .num{font-variant-numeric:tabular-nums}
  /* masthead */
  header.mast{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h1{font-size:27px;line-height:1.12;margin:0;font-weight:650;text-wrap:balance}
  .pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;
    background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);
    padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
  .stand{color:var(--ink-soft);font-size:14.5px;margin:10px 0 0;max-width:78ch}
  /* generic */
  .grid{display:grid;gap:16px}
  h2.sec{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin:34px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
  .card .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  /* score row */
  .scorerow{grid-template-columns:1fr 1.35fr;margin-bottom:8px}
  @media(max-width:820px){.scorerow{grid-template-columns:1fr}}
  .score-big{font-size:56px;font-weight:700;line-height:1;color:var(--accent)}
  .score-big small{font-size:22px;color:var(--muted);font-weight:500}
  .scoremeta{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
  .flat{display:inline-block;font-size:11.5px;font-weight:700;color:var(--muted);
    background:var(--sunk);border-radius:999px;padding:1px 9px;margin-left:2px}
  /* pillar bars */
  .bar-row{display:flex;align-items:center;gap:10px;margin:11px 0;font-size:12.5px}
  .bl{width:186px;color:var(--ink-soft)}
  @media(max-width:820px){.bl{width:130px}}
  .bt{flex:1;height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
  .bf{height:100%;border-radius:6px}
  .ghost{position:absolute;top:-3px;width:2px;height:16px;background:var(--muted);opacity:.7}
  .bv{width:92px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .up{color:var(--accent);font-weight:700}.dn{color:var(--critical);font-weight:700}.z{color:var(--muted);font-weight:700}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  /* two-col */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  ul.tight{margin:6px 0 0;padding-left:18px}
  ul.tight li{margin:6px 0;font-size:13px;color:var(--ink-soft)}
  ul.tight li b{color:var(--ink)}
  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  @media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--rule);border-left-width:4px;border-radius:10px;padding:13px 14px}
  .tile.ok{border-left-color:var(--accent)} .tile.warn{border-left-color:var(--warning)}
  .tile.bad{border-left-color:var(--critical)} .tile.na{border-left-color:var(--muted)}
  .tlab{font-size:11px;color:var(--muted);min-height:28px;line-height:1.35}
  .tval{font-size:23px;font-weight:680;margin:3px 0;font-variant-numeric:tabular-nums}
  .tsub{font-size:10.5px;color:var(--muted)}
  .tbadge{display:inline-block;margin-top:8px;color:#fff;font-size:9.5px;font-weight:700;
    padding:2px 8px;border-radius:999px;letter-spacing:.04em}
  .b-ok{background:var(--accent)} .b-warn{background:var(--warning)} .b-bad{background:var(--critical)} .b-na{background:var(--muted)}
  /* tables */
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);
    border:1px solid var(--rule);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
  th{background:var(--sunk);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .g{color:var(--accent);font-weight:600}.r{color:var(--critical);font-weight:600}.w{color:var(--warning);font-weight:600}
  code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px}
  /* decision */
  .decision{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--critical);
    border-radius:12px;padding:18px 20px 8px}
  .decision h3{margin:0 0 6px;font-size:16px;color:var(--critical)}
  .plan{counter-reset:step;list-style:none;margin:6px 0 0;padding:0}
  .plan li{position:relative;padding:8px 0 8px 34px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-soft)}
  .plan li:last-child{border-bottom:none}
  .plan li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:8px;
    width:22px;height:22px;border-radius:50%;background:var(--accent-bg);color:var(--accent);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .plan li b{color:var(--ink)}
  .prio{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:999px;margin-left:6px;color:#fff;vertical-align:middle}
  .p1{background:var(--critical)}.p2{background:var(--warning)}.p3{background:var(--muted)}
  .note-box{font-size:12.5px;color:var(--ink-soft);background:var(--sunk);border:1px solid var(--rule);
    border-radius:8px;padding:12px 14px;margin-top:16px}
  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted)}
  @media print{
    body{background:#fff}
    .card,.tile,table,.decision,.note-box{background:#fff}
    .bf,.bt,.ghost,.tbadge,.prio,.plan li::before{background:#fff!important;color:#222!important}
    .bf{border:1px solid #222}
    :root{--muted:#222;--ink-soft:#222}
    .card,table,section,.tile,.decision{break-inside:avoid}
  }
</style>
<style id="apple-layer">
/* ============================================================
   APPLE LAYER — apple-design skill, 2026-09-24. Modelled on Omni-TMDV.
   Additive: sits after the base sheet and only overrides.
   LIGHT ONLY (Ty, 2026-09-24): no dark theme — do not add one.
   ============================================================ */
:root{color-scheme:light;
  --accent-ink:var(--accent); --critical-ink:var(--critical);
  --on-fill:#FFFFFF;        /* text on a solid accent badge */
  --on-warning:#1C1C1E;     /* white on amber is 2.1:1 — amber badges take dark text */
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadow-float:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
body{background:var(--paper);color:var(--ink)}

/* Text set in an accent uses the -ink tier; fills keep the raw accent */
.score-big,.up,.g,.pill{color:var(--accent-ink)}
.dn,.r,.decision h3{color:var(--critical-ink)}
.w{color:var(--warning-ink)}
.tbadge,.prio{color:var(--on-fill)}
.b-warn,.p2{color:var(--on-warning)}

/* Typography — optical sizing; small text gets a hair of positive tracking */
body{font-optical-sizing:auto;text-rendering:optimizeLegibility}
.tlab,.tsub,.note,.scoremeta,footer{letter-spacing:.01em}

/* Materials — cards float; the decision reads thicker */
.card,.tile,table{box-shadow:var(--shadow-card)}
.decision{box-shadow:var(--shadow-float)}

/* Response — press feedback on anything pressable */
a,button,summary{transition:transform 100ms ease-out}
a:active,button:active,summary:active{transform:scale(.97)}

/* Accessibility — the three independent signals */
@media (prefers-contrast:more){:root{--rule:#8E8E93;--muted:#3C3C43}}
@media (prefers-reduced-motion:reduce){a:active,button:active,summary:active{transform:none}}

@media print{body{background:#fff}.card,.tile,table,.decision{box-shadow:none!important}}
</style>
<div class="wrap"><div id="app"></div></div>
<!-- Data lives beside this page in data/. Opened from anywhere else (a claude.ai
     artifact, a local copy) the relative path fails and we fall back to the
     canonical published copy, so one file works everywhere. -->
<script>
(function(){
  var ABS='https://ttrng3.github.io/Omni-Audit/', base='';
  function j(u){return fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' — '+u); return r.json();});}
  function get(p){return j(base+p).catch(function(e){
    if(base===ABS) throw e; base=ABS; return j(base+p);});}
  get('data/index.json').then(function(idx){
    return get('data/runs/'+idx.current+'.json');
  }).then(function(run){
    document.getElementById('app').innerHTML=run.html;
  }).catch(function(err){
    document.getElementById('app').innerHTML=
      '<div class="card"><h1>Chưa tải được dữ liệu</h1><p><b>Lỗi:</b> '+
      String(err.message).replace(/[&<>]/g,'')+'</p><p>Dữ liệu nằm trong '+
      '<code>data/index.json</code> và <code>data/runs/</code>.</p></div>';
  });
})();
</script>
